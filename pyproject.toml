[project]
name = "predictygraph"
dynamic = ["version"]
description = "Predictable graphs: a readable, CSS-styled diagram DSL with per-group layouts, rendered to SVG/APNG"
authors = [{name = "Reza Jelveh", email = "git@jelveh.me"}]
dependencies = ["tinycss2>=1.5.1", "typer>=0.26.8", "pillow>=11.0.0"]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "Apache-2.0"}

[project.optional-dependencies]
apng = ["cairosvg>=2.7"]

[project.scripts]
predictygraph = "predictygraph.cli:app"
pdg = "predictygraph.cli:app"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm.version]
source = "scm"

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B007", "B008", "B019", "B023", "B039", "B905"]

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint.isort]
split-on-trailing-comma = false
