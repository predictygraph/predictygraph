name: wheels

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install wheel and run tests
        shell: bash
        run: |
          uv venv
          uv pip install dist/*.whl pytest
          mv src src.off 2>/dev/null || true
          uv run --no-project pytest
          uv run --no-project pdg --help

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - name: Skip without token
        if: env.PYPI_API_TOKEN == ''
        run: echo "::notice::PYPI_API_TOKEN not set, skipping publish"
      - uses: astral-sh/setup-uv@v6
        if: env.PYPI_API_TOKEN != ''
      - uses: actions/download-artifact@v4
        if: env.PYPI_API_TOKEN != ''
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        if: env.PYPI_API_TOKEN != ''
        run: uv publish --token "$PYPI_API_TOKEN"
